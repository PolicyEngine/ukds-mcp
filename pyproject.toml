[project]
name = "ukds-mcp"
version = "0.1.0"
description = "MCP server for the UK Data Service — search datasets, manage projects, download microdata"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=1.26.0",
    "playwright>=1.58.0",
]

[tool.setuptools]
py-modules = ["server"]

[project.scripts]
ukds-mcp = "server:mcp.run"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
